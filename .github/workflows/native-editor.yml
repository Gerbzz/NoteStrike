name: Native editor checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --locked --features native-ui -j 2
      - name: Native editor build
        run: cargo build --locked --features native-ui --bin notestrike-native --bin notestrike -j 2
      - name: Capture hosted native editor
        shell: pwsh
        run: ./scripts/hosted-native-capture.ps1
      - name: Upload editor PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notestrike-editor-visual
          path: ${{ runner.temp }}/notestrike-editor-visual/*.png
          if-no-files-found: ignore
          retention-days: 1
