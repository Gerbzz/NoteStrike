name: Native editor checks

on:
  push:
    branches: [main, "notestrike-**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The packages the README lists for building on Debian/Ubuntu, plus a
      # virtual X server and Mesa's software OpenGL for the capture step.
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            xvfb libgl1-mesa-dri

      - name: Toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all features)
        run: cargo clippy --locked --all-features --all-targets -- -D warnings

      - name: Clippy (library and CLI only)
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings

      - name: Tests (all features)
        run: cargo test --locked --all-features

      - name: Release build
        run: cargo build --locked --release --all-features --bin notestrike --bin notestrike-cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Opens the real window, renders one frame, writes a PNG and exits.
      # Linux runs it on a virtual X server with Mesa's software renderer.
      - name: Capture the real window (Linux, xvfb)
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' \
            python scripts/ci_capture.py target/release/notestrike "$RUNNER_TEMP/notestrike-captures"

      - name: Capture the real window (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: python scripts/ci_capture.py target/release/notestrike "$RUNNER_TEMP/notestrike-captures"

      # Hosted Windows runners have no GPU driver, only GDI's OpenGL 1.1, and
      # the editor needs OpenGL 2+. Tried, but not required to pass.
      - name: Capture the real window (Windows, best effort)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: python scripts/ci_capture.py target/release/notestrike.exe "$RUNNER_TEMP/notestrike-captures"

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notestrike-captures-${{ runner.os }}
          path: ${{ runner.temp }}/notestrike-captures/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: notestrike-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/notestrike
            target/release/notestrike-cli
            target/release/notestrike.exe
            target/release/notestrike-cli.exe
          if-no-files-found: error
          retention-days: 14
