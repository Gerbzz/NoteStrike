[package]
name = "notestrike"
version = "0.2.0"
edition = "2024"
description = "NoteStrike: a lightweight plain-text editor (Notepad replacement) from the PWDS Strike suite"

[dependencies]
same-file = "=1.0.6"
uuid = { version = "=1.26.1", features = ["v4"] }
sha2 = "0.11"
serde_json = "1"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "accesskit", "wayland", "x11"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
rfd = { version = "=0.17.2", optional = true }

# macOS application menu (src/macos_menu.rs). These are the versions eframe and
# rfd already depend on, so they add no new crates to the build.
[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30.13", default-features = false, optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"], optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder"], optional = true }

[features]
default = ["native-ui"]
native-ui = ["dep:eframe", "dep:image", "dep:rfd", "dep:winit", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

# The desktop editor. Built by default; `--no-default-features` builds only the
# library and the `notestrike-cli` helper.
[[bin]]
name = "notestrike"
path = "src/main.rs"
required-features = ["native-ui"]

# Command-line helper: inspect a file's encoding and line endings, or list and
# import a legacy NoteStrike notebook as plain files. No GUI dependency.
[[bin]]
name = "notestrike-cli"
path = "src/bin/notestrike-cli.rs"
