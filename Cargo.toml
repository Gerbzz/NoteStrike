[package]
name = "notestrike"
version = "0.1.0"
edition = "2024"

[dependencies]
same-file = "=1.0.6"
uuid = { version = "=1.26.1", features = ["v4"] }
sha2 = "0.11"
serde_json = "1"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "accesskit", "wayland", "x11"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }

[features]
native-ui = ["dep:eframe", "dep:image"]

[[bin]]
name = "notestrike-native"
path = "src/bin/notestrike-native.rs"
required-features = ["native-ui"]

